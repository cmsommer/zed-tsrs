id = "typescript-rs-ls"
name = "TypeScript RS Language Server"
description = "tsrs: Rust port of TypeScript 7's native compiler and language server."
version = "0.1.0"
schema_version = 1
authors = ["Christiaan Sommer <csommer@sforsoftware.nl>"]
repository = "https://github.com/csommer/zed-tsrs"

[language_servers.typescript-rs-ls]
name = "TypeScript RS LS"
# The native TypeScript server determines ScriptKind from LSP languageId (textDocument/didOpen).
# Maps Zed's language names to standard LSP languageId values:
#   typescript -> ScriptKindTS, typescriptreact -> ScriptKindTSX,
#   javascript -> ScriptKindJS, javascriptreact -> ScriptKindJSX
language_ids = { TypeScript = "typescript", TSX = "typescriptreact", JavaScript = "javascript", JSX = "javascriptreact" }
languages = ["TypeScript", "TSX", "JavaScript", "JSX"]
